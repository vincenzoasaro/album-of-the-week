name: Build and deploy

on:
  # Every save in the CMS is a commit to main, so the site rebuilds right away.
  push:
    branches: [main]
  # Rebuild every night so scheduled albums go live on their publish date.
  # 22:05 and 23:05 UTC = just after midnight in Italy, in summer and in winter.
  schedule:
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
  # Lets you trigger a build by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
